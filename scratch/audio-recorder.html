<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sena Academy - Voice Memo Recorder</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #151d30;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--surface);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 450px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .status {
      font-size: 0.75rem;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
    }

    .status.recording {
      color: var(--error);
      background: rgba(239, 68, 68, 0.1);
      animation: pulse 1.5s infinite;
    }

    .timer {
      font-size: 3rem;
      font-weight: 700;
      font-family: monospace;
      margin-bottom: 2rem;
      color: var(--text);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      font-size: 0.875rem;
    }

    .btn-record {
      background-color: var(--error);
      color: white;
    }

    .btn-record:hover {
      background-color: #dc2626;
    }

    .btn-stop {
      background-color: var(--text);
      color: var(--bg);
      display: none;
    }

    .btn-stop:hover {
      background-color: #cbd5e1;
    }

    canvas {
      width: 100%;
      height: 80px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }

    .audio-preview {
      margin-top: 1rem;
      width: 100%;
      display: none;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Voice Note Recorder</h1>
    <p>Record your campaign call memo. High-quality 16-bit WAV format.</p>

    <div class="status" id="status">Ready</div>
    <div class="timer" id="timer">00:00</div>

    <canvas id="visualizer"></canvas>

    <div class="controls">
      <button class="btn-record" id="btn-record" onclick="startRecording()">Record</button>
      <button class="btn-stop" id="btn-stop" onclick="stopRecording()">Stop & Download</button>
    </div>

    <audio id="audio-player" class="audio-preview" controls></audio>
  </div>

  <script>
    let audioContext;
    let mediaRecorder;
    let stream;
    let recording = false;
    let startTime;
    let timerInterval;
    let audioChunks = [];
    let analyser;
    let canvas = document.getElementById('visualizer');
    let canvasCtx = canvas.getContext('2d');
    let animationId;

    // Draw visualizer line initially
    drawStaticLine();

    function drawStaticLine() {
      canvasCtx.fillStyle = 'rgb(21, 29, 48)';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      canvasCtx.lineWidth = 2;
      canvasCtx.strokeStyle = 'rgb(148, 163, 184)';
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, canvas.height / 2);
      canvasCtx.lineTo(canvas.width, canvas.height / 2);
      canvasCtx.stroke();
    }

    async function startRecording() {
      audioChunks = [];
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        // Record chunks
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          const webmBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const wavBlob = await convertWebmToWav(webmBlob);
          
          const audioUrl = URL.createObjectURL(wavBlob);
          const player = document.getElementById('audio-player');
          player.src = audioUrl;
          player.style.display = 'block';

          // Trigger download
          const a = document.createElement('a');
          a.href = audioUrl;
          a.download = 'call_message.wav';
          a.click();
        };

        mediaRecorder.start();
        recording = true;

        document.getElementById('status').innerText = 'Recording';
        document.getElementById('status').className = 'status recording';
        document.getElementById('btn-record').style.display = 'none';
        document.getElementById('btn-stop').style.display = 'inline-block';
        document.getElementById('audio-player').style.display = 'none';

        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
        visualize();
      } catch (err) {
        alert('Error accessing microphone: ' + err.message);
      }
    }

    function stopRecording() {
      if (!recording) return;
      mediaRecorder.stop();
      stream.getTracks().forEach(track => track.stop());
      clearInterval(timerInterval);
      cancelAnimationFrame(animationId);
      drawStaticLine();
      recording = false;
      document.getElementById('status').innerText = 'Ready';
      document.getElementById('status').className = 'status';
      document.getElementById('btn-record').style.display = 'inline-block';
      document.getElementById('btn-stop').style.display = 'none';
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const seconds = String(elapsed % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `${minutes}:${seconds}`;
    }

    function visualize() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      const draw = () => {
        animationId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = 'rgb(21, 29, 48)';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          barHeight = dataArray[i] / 2;
          canvasCtx.fillStyle = `rgb(59, 130, 246)`;
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          canvasCtx.fillRect(x, 0, barWidth, barHeight); // Symmetric visualizer
          x += barWidth + 1;
        }
      };
      draw();
    }

    // Direct WebAudio PCM to WAV compiler
    async function convertWebmToWav(webmBlob) {
      const arrayBuffer = await webmBlob.arrayBuffer();
      const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
      
      const numOfChan = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const format = 1; // 1 = raw PCM
      const bitDepth = 16;
      
      let result;
      if (numOfChan === 2) {
        result = interleave(audioBuffer.getChannelData(0), audioBuffer.getChannelData(1));
      } else {
        result = audioBuffer.getChannelData(0);
      }
      
      const buffer = new ArrayBuffer(44 + result.length * 2);
      const view = new DataView(buffer);
      
      // RIFF identifier
      writeString(view, 0, 'RIFF');
      // file length
      view.setUint32(4, 36 + result.length * 2, true);
      // RIFF type
      writeString(view, 8, 'WAVE');
      // format chunk identifier
      writeString(view, 12, 'fmt ');
      // format chunk length
      view.setUint32(16, 16, true);
      // sample format (raw)
      view.setUint16(20, format, true);
      // channel count
      view.setUint16(22, numOfChan, true);
      // sample rate
      view.setUint32(24, sampleRate, true);
      // byte rate (sample rate * block align)
      view.setUint32(28, sampleRate * numOfChan * (bitDepth / 8), true);
      // block align (channel count * bytes per sample)
      view.setUint16(32, numOfChan * (bitDepth / 8), true);
      // bits per sample
      view.setUint16(34, bitDepth, true);
      // data chunk identifier
      writeString(view, 36, 'data');
      // chunk length
      view.setUint32(40, result.length * 2, true);
      
      // write PCM audio samples
      floatTo16BitPCM(view, 44, result);
      
      return new Blob([view], { type: 'audio/wav' });
    }

    function interleave(inputL, inputR) {
      const length = inputL.length + inputR.length;
      const result = new Float32Array(length);
      let index = 0;
      let inputIndex = 0;
      while (index < length) {
        result[index++] = inputL[inputIndex];
        result[index++] = inputR[inputIndex];
        inputIndex++;
      }
      return result;
    }

    function floatTo16BitPCM(output, offset, input) {
      for (let i = 0; i < input.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, input[i]));
        output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }
  </script>
</body>
</html>
